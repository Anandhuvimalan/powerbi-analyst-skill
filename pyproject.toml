[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbi-autonomous-agent"
version = "0.3.0"
description = "Execute the Power BI analyst skill into transactional PBIP projects"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "openpyxl>=3.1,<4", "mcp>=1.12,<2", "pillow>=11,<13"]

[project.optional-dependencies]
sql = ["pyodbc>=5.2,<6"]
test = ["pytest>=8,<10"]

[project.scripts]
powerbi-agent = "powerbi_agent.cli:main"

[tool.setuptools.packages.find]
include = ["powerbi_agent*"]

[tool.setuptools.package-data]
powerbi_agent = ["schemas/*.json", "tools/*.ps1"]

[tool.setuptools.data-files]
"share/powerbi-analyst" = ["powerbi-analyst/SKILL.md"]
"share/powerbi-analyst/references" = ["powerbi-analyst/references/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
